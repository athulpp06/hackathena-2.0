version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  LeakedIn – docker-compose for local development & demo
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: leakedin-backend:latest
    container_name: leakedin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5500,http://frontend,http://127.0.0.1:5500
      - PYTHONUNBUFFERED=1
      - RATE_LIMIT=30/minute
      - TRUSTED_PROXY=true
    volumes:
      # Persist reputation SQLite DB and EasyOCR model cache between runs
      - leakedin-db:/app/backend/app/db
      - easyocr-cache:/app/.EasyOCR
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Nginx static) ─────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: leakedin-frontend
    restart: unless-stopped
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  leakedin-db:
    driver: local
  easyocr-cache:
    driver: local
