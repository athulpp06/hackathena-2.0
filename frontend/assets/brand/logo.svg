<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01234"/>
      <stop offset="100%" stop-color="#990014"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#cb011f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container (subtle dark card) -->
  <rect x="2" y="2" width="476" height="116" rx="8" fill="#080808" stroke="#1f1f1f" stroke-width="1.5"/>

  <!-- Logo Mark (Shield Icon) -->
  <g transform="translate(24, 20)" filter="url(#glow)">
    <rect width="80" height="80" rx="16" fill="url(#shieldGrad)"/>
    <path fill="#050505" d="M18 30h11v38H18V30zm5.5-19.8c3.5 0 6.3 2.7 6.3 6.1s-2.8 6.1-6.3 6.1-6.3-2.7-6.3-6.1 2.8-6.1 6.3-6.1zm44.5 57.8h-11V48.6c0-11.6-13.8-10.7-13.8 0V68H29.2V30h10.4v6.1c4.8-8.9 24.1-9.6 24.1 8.5V68z"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(124, 34)">
    <!-- Brand Title -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'IBM Plex Mono', 'Inter', monospace, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)">
      LEAKED<tspan fill="#e01234">IN</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'IBM Plex Mono', monospace, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#888888">
      AI RECRUITMENT FRAUD &amp; SCAM SHIELD
    </text>
  </g>

  <!-- Status Indicator Tag -->
  <g transform="translate(390, 22)">
    <rect width="66" height="20" rx="4" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="10" cy="10" r="3.5" fill="#10b981"/>
    <text x="20" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#10b981">
      ACTIVE
    </text>
  </g>
</svg>
